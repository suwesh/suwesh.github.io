{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
        </ul>

        <!-- Dark Mode Toggle Button -->
        <button id="theme-toggle" onclick="toggleDarkMode()" aria-label="Toggle Dark Mode" style="background: none; border: none; font-size: 1.1rem; cursor: pointer; padding: 0 10px; margin-left: auto;">
          🌙
        </button>

        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>

<script>
  function toggleDarkMode() {
    const body = document.body;
    body.classList.toggle("dark-theme");
    const isDark = body.classList.contains("dark-theme");
    localStorage.setItem("theme", isDark ? "dark" : "light");
    document.getElementById("theme-toggle").textContent = isDark ? "☀️" : "🌙";
  }

  // Set theme before full page renders to prevent flickering
  (function() {
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-theme");
      document.addEventListener("DOMContentLoaded", () => {
        const btn = document.getElementById("theme-toggle");
        if (btn) btn.textContent = "☀️";
      });
    }
  })();
</script>
